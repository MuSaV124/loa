name: Refresh market cache

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh the production market snapshot
        env:
          REFRESH_SECRET: ${{ secrets.MARKET_CACHE_REFRESH_SECRET }}
        shell: bash
        run: |
          test -n "$REFRESH_SECRET"
          curl --fail --show-error --silent \
            --request POST \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 75 \
            --header "Authorization: Bearer $REFRESH_SECRET" \
            https://loa-beige.vercel.app/api/refresh-market-cache
